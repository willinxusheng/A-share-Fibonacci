# -*- coding: utf-8 -*-
# A-share-Fibonacci 云端每日自动更新工作流（方案：不依赖任何常开客户端）
#
# 作用：在 GitHub 云端 runner 上完整跑通看板管线，并把最新数据 (data/) 提交回 main 分支。
#       GitHub Pages 从 main /(root) 直接托管 index.html + data/data.js，
#       因此只要本工作流成功跑通并 push，线上看板即自动更新——本地电脑关机也无妨。
#
# 前提（用户一次性操作，见文末说明）：
#   1) 仓库 Settings → Pages → Build and deployment:
#        Source = "Deploy from a branch", Branch = main, Folder = /(root)
#   2) 若 main 分支开启了"Require a pull request before merging"等保护规则，
#      需允许本工作流推送（或暂时对 main 关闭该保护），否则 push 会被拒。
#
# ③ 部署架构等价确认（R87 借鉴缠论 deploy.yml 显式 deploy-pages 评估）：
#   缠论用 configure-pages@v6 + upload-pages-artifact@v5 + deploy-pages@v5 三步显式发布；
#   本仓采用「Deploy from a branch (main, /root)」——push main 即触发 Pages 自动重新部署，
#   与上述显式三步在效果上等价（均为 push→Pages 自动发布），且已由 R58 显式 git push origin main 加固。
#   故不强改部署架构（避免引入 artifact 上传/部署权限带来的额外失败面），仅在上方 ② 补齐 keep-alive 即可。
#
# 取数架构（R271）：多源链式回退，彻底解决海外 runner 取数问题。
#   fetch_indices.py / build_data._ensure_raw 经 datafeed.py 取数：
#     ① eastmoney (push2his) —— 中国本地主源（本机/Mac 走此路径，与历史一致）
#     ② yahoo finance (query1/2.finance.yahoo.com) —— 美国本土服务，
#         GitHub 海外 runner 可正常访问，是云端每日更新的关键回退
#     ③ stooq (stooq.com) —— 补充回退（部分网络会被反爬挑战，解析失败即跳过）
#   任一源成功即写入与 read_kline_md 兼容的 6 列 markdown 表；全失败才告警降级。
#   因此：本工作流在 GitHub 海外 runner 上也能拉到当日数据，云端单写成立，
#   用户本地电脑关机/出差也不影响每日自动更新。
#
# ─────────────────────────────────────────────────────────────────────────────
# R46 云端加强（针对 2026-08-19/08-20 静默漏更事故的根治）：
#   事故根因 = 单一 cron 偶发被 GitHub 跳过 + 取数零重试 + 失败零告警 → 断更两天无感知。
#   对标缠论看板「deploy.yml + push 触发 Pages 自动部署」的稳健无人值守模式，做四重加固：
#     ① 多时段 cron 兜底：北京 16:30 / 18:30 / 21:30 三触 + 22:30 健康检查，
#        任一时段被 GitHub 跳过，更晚时段仍会补跑（新鲜度门卫保证已更新即跳过）。
#     ② 取数重试：fetch_indices 包 3 次重试，消除海外 runner 网络抖动的偶发失败。
#     ③ 失败可见告警：流水线失败时自动开/更新仓库 issue（label=ci-alert），
#        把"静默漏更"变成你能在 GitHub 看到的红标（issue 通知邮件）。
#     ④ 新鲜度自检：每轮先判"今天是否已更新 / 是否周末"，已更新或周末直接跳过；
#        提交前再校验 data.js fetchedAt==今天，防"回退旧值当新数据"的假更新。
#        22:30 健康检查专门兜底"全天所有触发都被跳过"的极端情形并告警。
#
# R806 自愈闭环（①+②+③，针对"cron 被 GitHub 跳过 → 主数据+情绪双双停更"系统性弱点）：
#   ① 独立看门狗 freshness-watch.yml（北京 23:30 单独调度，与本工作流 crons 互相独立不被同批跳过）：
#      读 EXPECTED(预期最后交易日) vs data.js `updated`(本快照覆盖的交易日) 比对；
#      陈旧则 `gh workflow run daily.yml -f force=true` 自动重触发 + 开/更新 issue；健康则关闭陈旧 issue。
#   ② 陈旧硬失败断言（见下方「Commit & push」步骤）：build 后再次语义比对，
#      EXPECTED != BUILT(本次构建后 `updated`) 即 `::error::` + exit 1，把"跑了但数据仍陈旧"变响亮失败，
#      既阻断当日部署（不污染线上旧数据），又被 ci-alert / 看门狗捕获触发重跑。
#   ③ 语义级新鲜度判据（取代脆弱的"fetchedAt 小时>=15"启发式）：
#      由共享脚本 expected_trading_day.py（含 2026 上交所休市表）统一算出预期最后交易日，
#      与 data.js `updated` 比对；节假日/周末由脚本统一处理，不再依赖魔法小时常量，杜绝同类假绿。
#      （freshness-watch.yml 与 daily.yml 共用同一脚本、同一判据，单一真源。）
# ─────────────────────────────────────────────────────────────────────────────

name: Daily A-share Fibonacci update

on:
  # 北京时间（=UTC+8）：主 16:30=UTC08:30；兜底 18:30=UTC10:30；21:30=UTC13:30；健康检查 22:30=UTC14:30。
  # （R812 校正：第三个点实际为 21:30，原注释误写 21:00，与实际 cron "30 13" 不符。）
  # 多触发点互相兜底：GitHub 偶发跳过某次调度时，更晚时段仍会补跑（freshness gate 保证已更新即跳过，不重复提交）。
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 10 * * *"
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建：忽略新鲜度门卫，即使判定今日已更新也重新抓取并构建。用于自动定时更新失败时的手动刷新。'
        type: boolean
        default: false
    # 允许在 Actions 页面手动触发，便于首跑实测、排错，以及自动更新失败时的强制刷新（配合 force 输入）。

# 允许工作流把最新 data/ 提交回本仓库 main 分支（Pages 随后自动重新部署），并允许就失败开 issue 告警。
permissions:
  contents: write
  issues: write

concurrency:
  group: a-share-fib-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 新鲜度门卫（始终运行，不受 skip 条件约束）──────────────────────────────
      # 周末（DOW 6/7）直接跳过整轮（A 股休市，无需更新，避免噪音告警）；
      # 工作日若 data.js fetchedAt 已是今天（北京），说明今天已成功更新，跳过整轮省 runner 分钟。
      - name: Freshness gate (skip if updated today / weekend / manual intraday)
        id: fresh
        run: |
          # R49 修复：手动触发落在盘中交易时段时，优雅跳过而非红失败。
          # 根因：workflow_dispatch 在 09:30–15:00（北京）触发会抓到盘中快照，
          # validate.py #11 会阻断部署；此守卫提前跳过，避免误发 ci-alert issue。
          # R814：本守卫必须排在 force 检查之前 —— force 的语义是「忽略新鲜度门卫、
          # 即使判定数据已最新也强制重建」，绝不应绕过「盘中不发布快照」的数据保护。
          # （此前 force 在前且遇 force 直接 exit 0，导致盘中勾 force 会绕过本守卫；
          #  虽最终被硬失败断言拦下、线上数据不受污染，却白白产生一次红失败与误告警。）
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HM=$(TZ=Asia/Shanghai date +%H:%M)
            H=${HM%:*}
            M=${HM#*:}
            tmin=$((10#$H * 60 + 10#$M))
            echo "manual trigger, Beijing time=$HM -> tmin=$tmin"
            if [ "$tmin" -ge 570 ] && [ "$tmin" -lt 900 ]; then
              echo "::notice::手动触发但当前为盘中交易时段（$HM），为避免把盘中快照当收盘数据发布，本次跳过（force=true 亦不例外）。请在 15:00 收盘后重新触发，或等待 16:30/18:30/21:30/22:30 自动补跑。"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # R804：force 输入为 true 时忽略新鲜度门卫，强制重建（自动定时更新失败时的逃生舱）。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "::notice::检测到 force=true，忽略新鲜度门卫，强制重新抓取并构建。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          DOW=$(TZ=Asia/Shanghai date +%u)   # 1=Mon .. 7=Sun
          echo "today=$TODAY dow=$DOW"
          if [ "$DOW" = "6" ] || [ "$DOW" = "7" ]; then
            echo "weekend, no trading -> skip entire run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f data/data.js ]; then
            echo "data/data.js missing -> must run"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # R806 语义级新鲜度判据（替代脆弱的"fetchedAt 小时>=15"启发式）：
          # 用 expected_trading_day.py 算出「当前预期最后交易日」EXPECTED，
          # 与 data.js 的 `updated`（=本快照覆盖的交易日，来自 K线真实末行日期）比对；
          # 相等=已更新(跳过)，不等=需重抓。节假日/周末由脚本统一处理，不再依赖魔法小时常量。
          # （ubuntu-latest 自带 python3，且脚本零第三方依赖，门卫阶段即可直接调用。）
          EXPECTED=$(python3 expected_trading_day.py)
          UPDATED=$(grep -oE '"updated": "[0-9]{4}-[0-9]{2}-[0-9]{2}"' data/data.js | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          echo "expected last trading day=$EXPECTED ; data updated=$UPDATED"
          if [ "$UPDATED" = "$EXPECTED" ]; then
            echo "already up to date ($UPDATED == $EXPECTED) -> skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale ($UPDATED != $EXPECTED) -> force re-fetch & rebuild"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # R810 情绪新鲜度门卫：计算「情绪覆盖的交易日」(sentiment.json history 末条 date)
      # 与 EXPECTED 比对。数据已最新(skip=true)但情绪陈旧时置 stale=true——解耦情绪重算与
      # 数据更新，避免「某天 gen_sentiment 偶发失败→次日 data 更新成功→fresh 永久 skip=true→
      # 情绪被锁死永不重算」的死锁（#806 同构但 cron 正常也会发生）。看门狗/22:30 检查也已加
      # sentiment 维度双重兜底。本步骤用裸 python3(零依赖,无需 setup-python)，与数据门卫解耦。
      - name: Sentiment freshness gate
        id: sentfresh
        run: |
          EXPECTED=$(python3 expected_trading_day.py)
          SENT_DATE=$(python3 -c "import json,sys; d=json.load(open('data/sentiment.json',encoding='utf-8')); print(d['history'][-1]['date'])" 2>/dev/null || echo "")
          echo "expected=$EXPECTED sentiment-covers=$SENT_DATE"
          if [ -z "$SENT_DATE" ]; then
            echo "sentiment missing/parse-fail -> must rebuild"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$SENT_DATE" = "$EXPECTED" ]; then
            echo "sentiment up to date ($SENT_DATE == $EXPECTED)"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "sentiment stale ($SENT_DATE != $EXPECTED) -> rebuild"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.fresh.outputs.skip != 'true' || steps.sentfresh.outputs.stale == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python deps
        if: steps.fresh.outputs.skip != 'true' || steps.sentfresh.outputs.stale == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        if: steps.fresh.outputs.skip != 'true' || steps.sentfresh.outputs.stale == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"   # audit52 的 node 沙箱运行时依赖 PATH 中的 node

      # 取数重试（R46 加固②）：海外 runner 网络抖动偶发失败，3 次重试消除单点脆弱。
      - name: Fetch indices (multi-source fallback, with retry)
        if: steps.fresh.outputs.skip != 'true'
        run: |
          ok=0
          for i in 1 2 3; do
            echo "=== fetch attempt $i ==="
            if python fetch_indices.py; then
              ok=1
              echo "fetch ok on attempt $i"
              break
            fi
            echo "fetch attempt $i failed, retrying in 20s..."
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::取数 3 次均失败（eastmoney/yahoo/stooq 可能全部不可用）"
            exit 1
          fi

      # R283 回归守门：取数链 fall-through 行为（确定性、无网络）。
      # 固化 datafeed.fetch_rows 的"短结果不终止、继续回退"契约——副指数海外
      # (eastmoney 失效、腾讯偶发只回 1 行) 必须越过腾讯落到 yahoo/stooq 拿完整历史，
      # 否则副指数共振 breadth 退化（production_oos_brier cnt=0、indexCompare 副指数仅 1 点）。
      # 任一条断言失败即 exit 1，阻断当日部署（反假绿硬守门，与取数同等级）。
      - name: Datafeed fallback regression (R283 gate)
        if: steps.fresh.outputs.skip != 'true'
        run: python selfcheck/test_datafeed_fallback.py

      - name: Preflight data sanity
        if: steps.fresh.outputs.skip != 'true'
        run: python preflight.py   # 主指数致命问题 -> exit 1，中止后续步骤

      - name: Analyze (Elliott wave)
        if: steps.fresh.outputs.skip != 'true'
        run: python analyze.py     # 使用仓库内 lib/price-action 副本（CI 自包含）

      - name: Build data.js (single source of truth)
        if: steps.fresh.outputs.skip != 'true'
        run: python build_data.py

      # 第 9 道闸门：首达概率三副本同步守门员（audit53）。
      # 用 ast 抽取 build_data._drift_prior_prob 与 oos_breadth.enrich 内联首达段真实源码、桩执行，
      # 与可导入真源 calibrate.first_passage_prob 及一份独立参考实现逐点数值比对；任一副本漂移
      # （改了公式忘改其他副本）即 EXIT≠0 阻断数据推送——杜绝弱守卫自洽假绿（R85 反假绿纪律）。
      - name: Gatekeepers (validate + audit49..53 + R108 holiday-target)
        if: steps.fresh.outputs.skip != 'true'
        run: |
          set -e
          for s in validate.py audit49.py audit50.py audit51.py audit52.py audit53.py audit_holiday_targets.py; do
            echo "=== $s ==="
            python "$s"
          done

      # 第 6 道闸门：标注重叠审计（真实 echarts SSR 渲染 + 文本包围盒判重）。
      # 旧版 daily.yml 漏了它，导致 CI 路径从不校验标注重叠；现已补回。
      # 仅依赖 echarts（纯 JS，ubuntu-latest 可直接安装）；canvas 已改为 _audit_overlap2.js
      # 内纯 JS 兜底（只用到 getContext('2d').measureText 估宽），无需原生 node-canvas，
      # 故不再受 cairo/pango 系统库缺失影响——CI 也能真正跑此门禁（重叠>0 则 EXIT=1 拦部署）。
      # echarts 版本必须 pin 到本地验证过的 5.4.3，否则新版渲染度量漂移会误报假阳性。
      - name: Install overlap-audit deps (echarts only, pinned)
        id: overlapdeps
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: |
          # 仅装 echarts（纯 JS）；canvas 已不需要（脚本内纯 JS 兜底）。
          # 加重试降低 npm 瞬时抖动导致的误跳过（重试仍失败才进入下方跳过分支）。
          for i in 1 2 3; do
            if npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/overlapdeps" echarts@5.4.3; then
              echo "echarts installed (attempt $i)"
              break
            fi
            echo "npm install attempt $i failed, retrying..."
            sleep 5
          done

      - name: Overlap audit (chart label collision gate)
        if: steps.fresh.outputs.skip != 'true'
        run: |
          if [ ! -d "$RUNNER_TEMP/overlapdeps/node_modules/echarts" ]; then
            # 仅当 echarts 真正装不上才跳过；用 ::warning:: 显式标注，
            # 避免第6道闸门被静默旁路却仍显示绿色对勾（R85 反假绿纪律）。
            echo "::warning::Overlap-audit gate (gate 6) SKIPPED — npm echarts@5.4.3 install unavailable; chart label-collision protection disabled for this run"
            echo "⚠️ overlap-audit 依赖未就绪（npm install 不可用），跳过该门禁（不阻断部署）"
            exit 0
          fi
          NODE_PATH="$RUNNER_TEMP/overlapdeps/node_modules" node _audit_overlap2.js

      # 第 7 道闸门：data.js 前端契约硬检查（verify_contract.js，纯 Node 无第三方依赖）。
      # 校验前端消费字段齐全且无 NaN/undefined/越界：state{text,cls}、tradePlan(stopLine/
      # sellTargets/buyZones 价格数值)、scenarioSwitch 三分支(active/base/risk) + 强势情景真实
      # 契约(D.scenarios[1]/subForecast)、signals[i]↔kline.ohlc[i] 长度匹配防前端越界读、
      # wavePoints/subWavePoints 价格等。任一条违约即 EXIT≠0 使本步骤失败 → 阻断提交推送
      # （安全失败，不污染线上旧数据）。默认读 <仓库根>/data/data.js（相对 __dirname 解析，
      # 与 cwd 无关）；此处显式传参避免路径歧义。
      - name: Contract check (data.js front-end contract, 7th gate)
        if: steps.fresh.outputs.skip != 'true'
        run: node selfcheck/verify_contract.js data/data.js

      # 第 8 道闸门：OOS Brier 防退化（R85 纪律自动化，落实项③）——软门禁（R86 对齐缠论）。
      # 复用 R217 的 walk-forward OOS 逐字复刻生产「分桶经验校准」的验证集 Brier，
      # 与 selfcheck/oos_baseline.json 比对；若概率引擎(build_data/calibrate)改动致
      # Brier 退化>5%，原设计 EXIT≠0 硬阻断推送（安全失败，不污染线上旧数据）。
      # —— R86 修复（对标缠论 deploy.yml 稳健无人值守模式）：
      #   OOS Brier 实际吃的是「当日 build 出的 data/data.js + 今日新抓 csv」，其值是
      #   每日行情的函数，相对固定历史基线(0.2276)本就会随行情自然浮动；硬阻断会把
      #   每日正常波动误判为"引擎退化"而静默漏更——与 R46 防漏更目标直接冲突
      #   （08-19/08-20 连续漏更的真因即此假阳性）。
      #   故改软门禁（R86）+ 黄色告警（R87 旭总拍板）：退化仅 CI 步骤打印 ::warning:: 黄色软告警
      #   （不再 exit 1 标红 error，透明可见、可回溯），不阻断每日数据推送；
      #   仅"取数失败/数据损坏"（Fetch indices 步骤 EXIT≠0）仍硬阻断。oos_guard 自身恒 exit 0
      #   （退化/无样本均 ::warning:: 黄色），真引擎失效由 import traceback 非零退出兜底。
      #   缠论看板即此模式——16 道准确率门禁 + quality_cert 全透明化、不阻断部署。
      - name: OOS Brier regression gate (R85 discipline, 8th gate) — soft-alert
        id: oos
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: python selfcheck/oos_guard.py

      # ④ 预测质量自检证书（R87 借鉴缠论 quality_cert.json，做 A股斐波那契适配版）。
      # 复用生产 OOS 闸门同一对单一真源（R217_segcal_check.run_oos 的 bucket_oos_brier +
      # oos_breadth.compute_production_oos_brier 的 production_brier5）与 data/backtest.json 实证命中率，
      # 生成 data/quality_cert.json（退出码恒 0，透明化、不阻断）。index.html 渲染「📊 预测质量自检证书」
      # 常驻区块，与缠论 quality_cert.json 等价定位。下方 git add data/ 会一并提交。
      # ⑥ 市场情绪温度（R87 借鉴缠论 sentiment/，monitor_only 代理）。
      # 由本仓已有单一真源 data/data.js 推导（量能/动量/波动/牛熊位置 + 宽基与跨市场广度），
      # 不新增第三方接口（涨跌家数只有 eastmoney 中国源，海外 runner 不可达，见 R271），
      # 绝不并入概率/方向预测主模型（守护 OOS Brier 真值）。退出码恒 0（透明化、不阻断）。
      # 注意：须在 quality_cert 之前运行，让证书读到当天最新的 sentiment（避免延迟一天）。
      - name: Generate market sentiment temperature (6th borrowing from chanlun, monitor_only)
        id: sentiment
        if: steps.fresh.outputs.skip != 'true' || steps.sentfresh.outputs.stale == 'true'
        continue-on-error: true
        run: python gen_sentiment.py

      # R810 情绪产物校验（去假绿）：gen_sentiment 为 continue-on-error 软步骤，即便脚本抛异常
      # CI 仍绿、sentiment.json 保留旧值 → 假绿。这里直接校验「产物」：重算后情绪覆盖日
      # (history 末条 date) 是否 == EXPECTED。不等则判定脚本失败/产出陈旧，开 ci-alert issue 暴露。
      - name: Verify sentiment actually refreshed (anti-false-green)
        id: sentverify
        if: always()
        continue-on-error: true
        run: |
          EXPECTED=$(python3 expected_trading_day.py)
          SENT_DATE=$(python3 -c "import json,sys; d=json.load(open('data/sentiment.json',encoding='utf-8')); print(d['history'][-1]['date'])" 2>/dev/null || echo "")
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "covered=$SENT_DATE" >> "$GITHUB_OUTPUT"
          echo "verify: expected=$EXPECTED sentiment-covers=$SENT_DATE"
          if [ "$SENT_DATE" = "$EXPECTED" ]; then
            echo "sentiment refreshed OK ($SENT_DATE == $EXPECTED)"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::情绪重算后覆盖日=$SENT_DATE 仍 != 预期=$EXPECTED，gen_sentiment.py 可能失败或产出陈旧"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # 情绪产物校验失败 → 开/更新 ci-alert issue（让静默失败可见，避免假绿长期冻住情绪）
      - name: Sentiment false-green alert
        if: always() && steps.sentverify.outputs.ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const expected = '${{ steps.sentverify.outputs.expected }}';
            const covered = '${{ steps.sentverify.outputs.covered }}';
            const { owner, repo } = context.repo;
            const ts = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const TITLE = '⚠️ 情绪看板重算失败（产物校验未通过）';
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: ['ci-alert'] });
            const found = existing.data.find(i => i.title === TITLE);
            const body = `gen_sentiment.py 重算后情绪覆盖日未达预期（expected=${expected}, covered=${covered}），疑似脚本失败或产出陈旧。\n运行日志：${runUrl}\n请检查 gen_sentiment.py 是否在 CI 抛异常（continue-on-error 已吞错，需看完整日志）。`;
            if (found) { await github.rest.issues.createComment({ owner, repo, issue_number: found.number, body: `再次检测到 @ ${ts}\n${runUrl}` }); }
            else { await github.rest.issues.create({ owner, repo, title: TITLE, body, labels: ['ci-alert'] }); }

      # 情绪契约实证门禁（R122 接入）：校验 sentiment v3 契约——
      # today/history/forecast 的 label 与动态分位标尺(scale.bounds)一致、forecast 全为交易日
      # （含补班日，非朴素周末判定）、连续性/跳转等。软门禁（monitor_only 透明、不阻断部署，仅告警可见）。
      # 注：审计脚本 REPO 已改为 os.path.dirname(__file__) 可移植，CI(Linux) 与本地(Windows) 同跑。
      - name: Sentiment contract audit (R122 gate)
        id: sentchk
        if: steps.fresh.outputs.skip != 'true' || steps.sentfresh.outputs.stale == 'true'
        continue-on-error: true
        run: python _audit_sentiment_check.py

      # 情绪契约深核（R122 接入）：contra 单一真值 + forecast 插值一致性 + 动态标尺 label 一致。
      - name: Sentiment deep-contract audit (R122 gate)
        id: sentdeep
        if: steps.fresh.outputs.skip != 'true' || steps.sentfresh.outputs.stale == 'true'
        continue-on-error: true
        run: python _audit_sentiment_contract.py

      - name: Generate prediction quality cert (4th borrowing from chanlun)
        if: steps.fresh.outputs.skip != 'true' || steps.sentfresh.outputs.stale == 'true'
        run: python gen_quality_cert.py

      # R233 回归守门（R90 修复后）：quality_cert.overall_hit_rate 必须诚实——
      # 含 cold 起步组、无「对已收缩 Laplace 估计再做 n 加权」的双重收缩。
      # 读取刚生成的 quality_cert.json 断言；回退到旧失真值(91.0)或漏计 cold 组即 ::warning::
      # （软门禁，不阻断部署，与 ⑤ 同款透明告警哲学）。
      - name: Cert backtest-fairness regression (R233)
        id: certreg
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: python R233_cert_backtest_test.py

      # ⑤ 预测准确性软门禁（R87 借鉴缠论 16 道准确率门禁：仅告警不阻断）。
      # 读取刚生成的 quality_cert.json，对 OOS Brier 退化 / 命中率异常做软告警，
      # 失败不阻断（continue-on-error，透明可见、可回溯，与缠论同款）。
      - name: Prediction-accuracy soft-alert (5th borrowing from chanlun)
        id: acc
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, sys
          p = "data/quality_cert.json"
          try:
              c = json.load(open(p, encoding="utf-8"))
          except Exception as e:
              print("::warning::quality_cert.json 缺失/损坏：%s" % e)
              sys.exit(0)
          st = c.get("accuracy_status")
          ob = c.get("oos_brier", {})
          print("预测质量：accuracy_status=%s, OOS status=%s" % (st, ob.get("status")))
          if st in ("REVIEW", "WATCH"):
              print("::warning::预测准确性软告警：accuracy_status=%s —— OOS Δ=%s%% / %s%%, 整体命中率=%s%%"
                    % (st, ob.get("production_delta_pct"), ob.get("bucket_delta_pct"),
                       c.get("backtest", {}).get("overall_hit_rate")))
          else:
              print("✅ 预测质量自检通过（软门禁不阻断部署）")
          PY

      # ②a v2：缠论视角面板每日自动刷新（best-effort，非阻塞）。
      # 缠论分析模块已 vendored 进 lib/chanlun/（零第三方依赖），输入复用本流程已抓的
      # data/sh000001.csv（单数据源、云端必成功），不再走 chanlun 原中国源。
      # 该步骤失败仅意味着 chanlun_view.js 不更新，Fib 主看板照常部署——故 continue-on-error。
      # 生成的 data/chanlun_view.js 会被下方「Commit & push」的 `git add data/` 一并提交。
      - name: Refresh chanlun view (best-effort, non-blocking)
        id: chanlun-view
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: python gen_chanlun_view.py

      # 提交前二次新鲜度校验（R46 加固④）：确认 build 后 data.js 的 fetchedAt 确为本日（北京），
      # 否则说明取数回退到旧快照却伪装成新数据 —— 放弃提交以免"假更新"掩盖取数故障。
      - name: Commit & push data back to main
        if: steps.fresh.outputs.skip != 'true'
        run: |
          # R806 陈旧硬失败断言（②）：构建后再次语义比对，把"跑了但数据仍陈旧"变响亮失败。
          # EXPECTED=当前预期最后交易日；BUILT=data.js 的 `updated`（本次构建后覆盖的交易日）。
          # 二者不符 -> 取数可能全源回退旧值 / 当日数据尚未就绪 -> ::error:: 红失败 + exit 1，
          # 既阻断当日部署（不污染线上旧数据），又被 ci-alert / 看门狗捕获触发重跑。
          EXPECTED=$(python3 expected_trading_day.py)
          BUILT=$(grep -oE '"updated": "[0-9]{4}-[0-9]{2}-[0-9]{2}"' data/data.js | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          if [ "$BUILT" != "$EXPECTED" ]; then
            echo "::error::构建后数据覆盖日=$BUILT 与预期最后交易日=$EXPECTED 不符 —— 疑似取数全源回退旧值或当日数据尚未就绪，放弃提交以免假更新"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 仅提交生成物（数据快照），不动源码
          git add data/
          if git diff --cached --quiet; then
            echo "⏭️ 数据无变化，跳过提交（市场休市或取数与上次一致）"
          else
            git commit -m "chore: daily data refresh (auto via GitHub Actions)"
            # 若 main 在取数期间被并发源码推送前移（双机/手动 push 源码），先 rebase 再推，
            # 避免 non-fast-forward 致当日数据未上线。data/ 与源码改动不冲突，rebase 安全。
            if git pull --rebase --autostash origin main; then
              # R58 加固：显式指定远端与分支，避免 actions/checkout 未设 tracking 时
              # `fatal: no upstream branch` 致当日数据推不上去（部署同步铁律失守）。
              git push origin main
              echo "✅ 已推送最新数据到 main，Pages 将自动重新部署"
            else
              git rebase --abort 2>/dev/null || true
              echo "⚠️ 与远端冲突，放弃本次推送（保留工作区数据，下轮重试）"
              exit 1
            fi
          fi

      # ② keep-alive commit（R87 借鉴缠论 deploy.yml，防 GitHub 因长期无 commit 停用 cron 调度）。
      # GitHub 对长期（约 60 天）无 commit 活动的仓库会**自动停用 scheduled workflows**，
      # 造成静默漏更且不易察觉。每天追加一个 [skip ci] 的 last_build.txt 戳 commit 即可保持调度活跃。
      # 本步骤仅在今天确已通过新鲜度门卫后追加一个空戳 commit，失败不阻断（continue-on-error），
      # 且 [skip ci] 不会触发额外 CI 循环——与缠论同款机制。
      - name: Keep-alive commit (prevent GitHub disabling scheduled runs)
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_build.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add last_build.txt
          git commit -m "chore: keep-alive [skip ci]" || echo "no changes"
          git push origin main || echo "keep-alive push skipped"

      # ── 失败可见告警（R46 加固③）──────────────────────────────────────────────
      # 流水线失败时自动开/更新仓库 issue（label=ci-alert），把"静默漏更"变成可见红标。
      # 仅主触发(16:30)与手动触发告警，避免 18:30/21:00 兜底重试的重复噪音；
      # 兜底仍全失败的情形由下方 22:30 健康检查统一兜底告警。
      - name: Alert on failure (open/update issue)
        if: failure() && steps.fresh.outputs.skip != 'true' && (github.event.schedule == '30 8 * * *' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = '⚠️ A股斐波那契看板每日数据更新失败';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const ts = new Date().toISOString();
            const body = `每日更新流水线失败（${ts}）。\n运行日志：${runUrl}\n请检查取数源 / 门禁是否异常（取数重试后仍失败，或某道门禁 EXIT≠0 阻断推送）。`;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: ['ci-alert'] });
            const found = existing.data.find(i => i.title === TITLE);
            if (found) {
              await github.rest.issues.createComment({ owner, repo, issue_number: found.number, body: `再次失败 @ ${ts}\n${runUrl}` });
            } else {
              await github.rest.issues.create({ owner, repo, title: TITLE, body, labels: ['ci-alert'] });
            }

      # ── 22:30 健康检查（R46 加固①兜底告警）────────────────────────────────────
      # 专门兜底"全天所有触发都被 GitHub 跳过 / 全部失败"的极端情形：到 22:30 若今天仍未更新，
      # 开/更新 issue 告警。周末与已更新则不告警（无噪音）。
      - name: Health check (did today get updated?)
        id: hc
        if: github.event.schedule == '30 14 * * *'
        run: |
          # R806 语义级健康检查（替代"fetchedAt 小时>=15"启发式）+ R810 加 sentiment 维度：
          # 比对 EXPECTED(预期最后交易日) 与 data.js `updated`(数据覆盖日) 及
          # sentiment.json history 末条 date(情绪覆盖日)。二者皆 == EXPECTED 才健康不告警，
          # 任一陈旧即告警（避免情绪死锁假绿——数据新鲜但情绪冻住时也能捕获）。
          # 节假日/周末由 expected_trading_day.py 统一处理，不再误报。
          EXPECTED=$(python3 expected_trading_day.py)
          UPDATED=$(grep -oE '"updated": "[0-9]{4}-[0-9]{2}-[0-9]{2}"' data/data.js | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          SENT_DATE=$(python3 -c "import json; d=json.load(open('data/sentiment.json',encoding='utf-8')); print(d['history'][-1]['date'])" 2>/dev/null || echo "")
          echo "health-check: expected=$EXPECTED ; data updated=$UPDATED ; sentiment-covers=$SENT_DATE"
          if [ "$UPDATED" = "$EXPECTED" ] && [ "$SENT_DATE" = "$EXPECTED" ]; then
            echo "today already updated & sentiment refreshed ($UPDATED==$EXPECTED, sent=$SENT_DATE==$EXPECTED) -> no alert"
            echo "alert=false" >> "$GITHUB_OUTPUT"
          else
            echo "NOT fully updated (data=$UPDATED, sentiment=$SENT_DATE, expected=$EXPECTED) -> alert"
            echo "alert=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Health-check alert (open/update issue)
        if: steps.hc.outputs.alert == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = '⚠️ A股斐波那契看板今日数据未更新';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const ts = new Date().toISOString();
            const body = `截至本日北京时间 22:30，今日数据仍未更新（最后 fetchedAt 见上一步日志）。\n最后运行：${runUrl}\n可能原因：调度被 GitHub 跳过 / 取数全失败 / 门禁阻断。请检查 Actions 运行记录与取数源。`;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: ['ci-alert'] });
            const found = existing.data.find(i => i.title === TITLE);
            if (found) {
              await github.rest.issues.createComment({ owner, repo, issue_number: found.number, body: `仍未更新 @ ${ts}\n${runUrl}` });
            } else {
              await github.rest.issues.create({ owner, repo, title: TITLE, body, labels: ['ci-alert'] });
            }
